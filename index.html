<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Фінанси</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0a0a0d;
    --card:#121216;
    --card-2:#17171c;
    --border:rgba(255,255,255,0.06);
    --text:#f5f5f7;
    --text-dim:#8a8a92;
    --text-faint:#5c5c64;
    --green:#34d582;
    --green-bg:rgba(52,213,130,0.12);
    --red:#ff5a5f;
    --red-bg:rgba(255,90,95,0.12);
    --blue:#4a9dff;
    --amber:#ffa740;
    --purple:#a374ff;
    --pink:#ff4d8d;
    --gray:#6b6b74;
    --accent:#4dd8c4;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%;
    overflow-x:hidden;
  }
  body{
    padding-top:calc(var(--safe-top) + 14px);
    padding-bottom:calc(var(--safe-bottom) + 92px);
  }
  .wrap{max-width:520px; margin:0 auto; padding:0 16px;}

  /* Header */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .month-select{
    display:flex; flex-direction:column; gap:2px; background:none; border:none;
    color:var(--text); font-size:22px; font-weight:700; text-align:left;
  }
  .month-select .row{display:flex; align-items:center; gap:6px;}
  .month-select .sub{font-size:13px; font-weight:500; color:var(--accent);}
  .chev{width:14px; height:14px; opacity:0.7;}
  .header-icons{display:flex; gap:10px;}
  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    position:relative; cursor:pointer;
  }
  .icon-btn .dot{
    position:absolute; top:9px; right:10px; width:7px; height:7px;
    background:var(--blue); border-radius:50%; border:1.5px solid var(--bg);
  }

  /* Balance card */
  .balance-card{
    background:linear-gradient(155deg,#15151b, #0e0e12 65%);
    border:1px solid var(--border);
    border-radius:22px;
    padding:20px 20px 16px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .balance-top{display:flex; align-items:flex-start; justify-content:space-between;}
  .balance-label{color:var(--text-dim); font-size:14px; font-weight:500; margin-bottom:8px;}
  .balance-amount{font-size:34px; font-weight:700; letter-spacing:-0.5px; display:flex; align-items:baseline; gap:6px;}
  .balance-amount .cur{font-weight:600; color:var(--text-dim); font-size:26px;}
  .eye-btn{
    width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.06);
    border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .balance-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
  .change-pill{
    background:var(--green-bg); color:var(--green);
    font-size:13px; font-weight:700; padding:6px 10px; border-radius:20px;
    display:flex; align-items:center; gap:4px;
  }
  .change-note{color:var(--text-dim); font-size:13px;}
  .spark{width:130px; height:44px;}

  /* Income / Expense */
  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .stat-card{
    border-radius:20px; padding:16px; border:1px solid var(--border);
  }
  .stat-card.income{background:linear-gradient(160deg, rgba(52,213,130,0.14), rgba(52,213,130,0.03));}
  .stat-card.expense{background:linear-gradient(160deg, rgba(255,90,95,0.14), rgba(255,90,95,0.03));}
  .stat-top{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .stat-icon{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .stat-icon.income{background:var(--green);}
  .stat-icon.expense{background:var(--red);}
  .stat-title{font-size:14px; color:var(--text-dim); font-weight:500;}
  .stat-bottom{display:flex; align-items:flex-end; justify-content:space-between;}
  .stat-amount{font-size:19px; font-weight:700;}
  .mini-bars{display:flex; align-items:flex-end; gap:2px; height:20px;}
  .mini-bars span{width:3px; border-radius:2px;}
  .income .mini-bars span{background:var(--green);}
  .expense .mini-bars span{background:var(--red);}

  /* Section card */
  .section{
    background:var(--card); border:1px solid var(--border);
    border-radius:22px; padding:18px; margin-bottom:14px;
  }
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .section-title{font-size:17px; font-weight:700;}
  .section-link{color:var(--blue); font-size:14px; font-weight:600; background:none; border:none; display:flex; align-items:center; gap:2px;}

  .donut-row{display:flex; align-items:center; gap:20px;}
  .donut-wrap{position:relative; width:170px; height:170px; flex-shrink:0;}
  .donut-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  .donut-center .amt{font-size:19px; font-weight:700;}
  .donut-center .lbl{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .cat-list{flex:1; display:flex; flex-direction:column; gap:14px; min-width:0;}
  .cat-item{display:flex; align-items:center; gap:10px;}
  .cat-icon{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .cat-name{font-size:13.5px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cat-amt{font-size:13.5px; font-weight:600; margin-right:8px; white-space:nowrap;}
  .cat-pct{font-size:13px; font-weight:700; width:34px; text-align:right; flex-shrink:0;}

  /* Transactions */
  .tx-item{display:flex; align-items:center; gap:12px; padding:10px 0;}
  .tx-item + .tx-item{border-top:1px solid var(--border);}
  .tx-icon{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .tx-mid{flex:1; min-width:0;}
  .tx-name{font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx-cat{font-size:13px; color:var(--text-dim); margin-top:1px;}
  .tx-right{text-align:right; flex-shrink:0;}
  .tx-amt{font-size:15px; font-weight:700;}
  .tx-amt.pos{color:var(--green);}
  .tx-time{font-size:12px; color:var(--text-faint); margin-top:2px;}

  /* Bottom nav */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    padding:10px 14px calc(10px + var(--safe-bottom));
    background:rgba(10,10,13,0.85);
    backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    max-width:520px; margin:0 auto;
  }
  .nav-item{
    background:none; border:none; color:var(--text-faint);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; font-weight:600; flex:1;
  }
  .nav-item.active{color:var(--blue);}
  .nav-item svg{width:22px; height:22px;}
  .nav-add{
    width:52px; height:52px; border-radius:50%;
    background:var(--blue);
    display:flex; align-items:center; justify-content:center;
    margin-top:-26px;
    box-shadow:0 0 0 6px var(--bg), 0 6px 18px rgba(74,157,255,0.4);
    border:none;
  }

  /* Modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:flex-end; z-index:50;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--card-2); width:100%; max-width:520px; margin:0 auto;
    border-radius:24px 24px 0 0; padding:20px 18px calc(20px + var(--safe-bottom));
    border:1px solid var(--border); border-bottom:none;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal h3{font-size:18px; font-weight:700; margin-bottom:16px;}
  .seg{display:flex; background:var(--card); border-radius:12px; padding:4px; margin-bottom:14px;}
  .seg button{
    flex:1; padding:9px; border:none; background:none; border-radius:9px;
    color:var(--text-dim); font-weight:700; font-size:13.5px;
  }
  .seg button.active.expense-active{background:var(--red-bg); color:var(--red);}
  .seg button.active.income-active{background:var(--green-bg); color:var(--green);}
  .field{margin-bottom:12px;}
  .field label{font-size:12.5px; color:var(--text-dim); font-weight:600; display:block; margin-bottom:6px;}
  .field input, .field select{
    width:100%; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; color:var(--text); font-size:15px;
    font-family:inherit;
  }
  .field select{-webkit-appearance:none; appearance:none;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; padding:14px; border-radius:14px; border:none; font-weight:700; font-size:15px;
  }
  .btn-cancel{background:var(--card); color:var(--text-dim);}
  .btn-save{background:var(--blue); color:#fff;}
  .toast{
    position:fixed; top:calc(var(--safe-top) + 10px); left:50%; transform:translateX(-50%) translateY(-60px);
    background:var(--card-2); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:14px; font-size:13.5px; font-weight:600;
    z-index:60; transition:transform .3s ease; box-shadow:0 8px 20px rgba(0,0,0,0.4);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <button class="month-select" id="monthBtn">
      <div class="row" id="monthLabel">Серпень
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="sub">Місяць</div>
    </button>
    <div class="header-icons">
      <button class="icon-btn" id="bellBtn">
        <span class="dot"></span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="#f5f5f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke="#f5f5f7" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#f5f5f7" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="#f5f5f7" stroke-width="1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="balance-card">
    <div class="balance-top">
      <div>
        <div class="balance-label">Баланс</div>
        <div class="balance-amount"><span class="cur">₴</span><span id="balanceAmt">18 450</span></div>
      </div>
      <button class="eye-btn" id="eyeBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="#f5f5f7" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="#f5f5f7" stroke-width="1.6"/></svg>
      </button>
    </div>
    <div class="balance-bottom">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="change-pill">↗ +12.5%</span>
        <span class="change-note">відносно липня</span>
      </div>
      <canvas class="spark" id="sparkCanvas" width="260" height="88"></canvas>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card income">
      <div class="stat-top">
        <div class="stat-icon income">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="#0a0a0d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="stat-title">Доходи</div>
      </div>
      <div class="stat-bottom">
        <div class="stat-amount">₴ <span id="incomeAmt">30 000</span></div>
        <div class="mini-bars">
          <span style="height:6px"></span><span style="height:10px"></span><span style="height:8px"></span><span style="height:16px"></span><span style="height:20px"></span>
        </div>
      </div>
    </div>
    <div class="stat-card expense">
      <div class="stat-top">
        <div class="stat-icon expense">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12l7 7 7-7" stroke="#0a0a0d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="stat-title">Витрати</div>
      </div>
      <div class="stat-bottom">
        <div class="stat-amount">₴ <span id="expenseAmt">11 550</span></div>
        <div class="mini-bars">
          <span style="height:8px"></span><span style="height:6px"></span><span style="height:14px"></span><span style="height:10px"></span><span style="height:18px"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">Витрати за категоріями</div>
      <button class="section-link">Детальніше <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#4a9dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="donut-row">
      <div class="donut-wrap">
        <canvas id="donutCanvas" width="340" height="340" style="width:170px;height:170px;"></canvas>
        <div class="donut-center">
          <div class="amt">₴ <span id="donutTotal">11 550</span></div>
          <div class="lbl">Всього</div>
        </div>
      </div>
      <div class="cat-list" id="catList"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">Останні транзакції</div>
      <button class="section-link">Дивитись всі</button>
    </div>
    <div id="txList"></div>
  </div>

</div>

<div class="bottom-nav">
  <button class="nav-item active" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-8 9 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Головна
  </button>
  <button class="nav-item" data-nav="stats">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z" stroke="currentColor" stroke-width="2"/><path d="M12 2v10l7 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Статистика
  </button>
  <button class="nav-add" id="addBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <button class="nav-item" data-nav="tx">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Транзакції
  </button>
  <button class="nav-item" data-nav="budget">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Бюджети
  </button>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Нова транзакція</h3>
    <div class="seg">
      <button id="segExpense" class="active expense-active">Витрата</button>
      <button id="segIncome">Дохід</button>
    </div>
    <div class="field">
      <label>Сума, ₴</label>
      <input type="number" inputmode="decimal" id="fAmount" placeholder="0">
    </div>
    <div class="field">
      <label>Назва</label>
      <input type="text" id="fName" placeholder="Напр. АТБ-Маркет">
    </div>
    <div class="field" id="catField">
      <label>Категорія</label>
      <select id="fCat"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelBtn">Скасувати</button>
      <button class="btn btn-save" id="saveBtn">Зберегти</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- Telegram bootstrap ----------
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0a0a0d'); } catch(e){}
    try { tg.setBackgroundColor('#0a0a0d'); } catch(e){}
  }
  function haptic(type){
    if (tg && tg.HapticFeedback) {
      if (type === 'impact') tg.HapticFeedback.impactOccurred('light');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    }
  }

  // ---------- Storage ----------
  const STORE_KEY = 'finance_app_state_v1';
  function loadState(){
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return null;
  }
  function saveState(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  }

  const CATEGORIES = {
    food:      { name: 'Їжа та продукти', color: '#ffa740', icon: '🛒' },
    transport: { name: 'Транспорт',        color: '#4a9dff', icon: '🚗' },
    fun:       { name: 'Розваги',          color: '#a374ff', icon: '🎮' },
    shopping:  { name: 'Покупки',          color: '#ff4d8d', icon: '🛍️' },
    other:     { name: 'Інше',             color: '#6b6b74', icon: '⋯' }
  };

  const defaultState = {
    transactions: [
      { id: 3, type:'income',  name:'Зарплата',     cat:'other',      amount:30000, date:'2026-08-01T00:00:00' },
      { id: 2, type:'expense', name:'Bolt',         cat:'transport',  amount:186,   date:'2026-08-14T19:20:00' },
      { id: 1, type:'expense', name:'АТБ-Маркет',   cat:'food',       amount:450,   date:'2026-08-14T23:41:00' }
    ]
  };

  let state = loadState() || defaultState;

  // ---------- Derived data ----------
  function fmt(n){ return Math.round(n).toLocaleString('uk-UA'); }

  function computeTotals(){
    let income = 0, expense = 0;
    const catTotals = {};
    Object.keys(CATEGORIES).forEach(k => catTotals[k] = 0);
    state.transactions.forEach(t => {
      if (t.type === 'income') income += t.amount;
      else {
        expense += t.amount;
        catTotals[t.cat] = (catTotals[t.cat] || 0) + t.amount;
      }
    });
    return { income, expense, catTotals, balance: income - expense };
  }

  function render(){
    const { income, expense, catTotals, balance } = computeTotals();
    document.getElementById('balanceAmt').textContent = fmt(balance);
    document.getElementById('incomeAmt').textContent = fmt(income);
    document.getElementById('expenseAmt').textContent = fmt(expense);
    document.getElementById('donutTotal').textContent = fmt(expense);

    // category list, sorted desc, only >0
    const entries = Object.entries(catTotals).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
    const catList = document.getElementById('catList');
    catList.innerHTML = '';
    entries.forEach(([key, amt]) => {
      const c = CATEGORIES[key];
      const pct = expense > 0 ? Math.round((amt/expense)*100) : 0;
      const row = document.createElement('div');
      row.className = 'cat-item';
      row.innerHTML = `
        <div class="cat-icon" style="background:${c.color}22; color:${c.color}">${c.icon}</div>
        <div class="cat-name">${c.name}</div>
        <div class="cat-amt">₴ ${fmt(amt)}</div>
        <div class="cat-pct" style="color:${c.color}">${pct}%</div>
      `;
      catList.appendChild(row);
    });
    if (entries.length === 0){
      catList.innerHTML = '<div style="color:var(--text-dim); font-size:13.5px;">Витрат ще немає</div>';
    }

    drawDonut(entries, expense);
    drawSpark();
    renderTx();
  }

  function renderTx(){
    const list = [...state.transactions].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 8);
    const el = document.getElementById('txList');
    el.innerHTML = '';
    list.forEach(t => {
      const isIncome = t.type === 'income';
      const c = CATEGORIES[t.cat] || CATEGORIES.other;
      const d = new Date(t.date);
      const isToday = d.toDateString() === new Date().toDateString();
      const timeStr = isToday
        ? d.toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit' })
        : d.toLocaleDateString('uk-UA', { day:'2-digit', month:'short' });
      const row = document.createElement('div');
      row.className = 'tx-item';
      row.innerHTML = `
        <div class="tx-icon" style="background:${isIncome ? '#34d58222' : c.color+'22'}; color:${isIncome ? '#34d582' : c.color}">
          ${isIncome ? '💳' : c.icon}
        </div>
        <div class="tx-mid">
          <div class="tx-name">${t.name}</div>
          <div class="tx-cat">${isIncome ? 'Доходи' : c.name}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amt ${isIncome ? 'pos' : ''}">${isIncome ? '+' : '-'}₴ ${fmt(t.amount)}</div>
          <div class="tx-time">${timeStr}</div>
        </div>
      `;
      el.appendChild(row);
    });
    if (list.length === 0){
      el.innerHTML = '<div style="color:var(--text-dim); font-size:13.5px; padding:6px 0;">Немає транзакцій</div>';
    }
  }

  function drawDonut(entries, total){
    const canvas = document.getElementById('donutCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const cx = W/2, cy = H/2, r = W/2 - 20, lw = 34;
    if (total <= 0){
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.strokeStyle = '#22222a';
      ctx.lineWidth = lw;
      ctx.stroke();
      return;
    }
    let start = -Math.PI/2;
    entries.forEach(([key, amt]) => {
      const c = CATEGORIES[key];
      const frac = amt / total;
      const end = start + frac * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, start, end);
      ctx.strokeStyle = c.color;
      ctx.lineWidth = lw;
      ctx.lineCap = 'butt';
      ctx.stroke();
      start = end;
    });
  }

  function drawSpark(){
    const canvas = document.getElementById('sparkCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const pts = [0.55, 0.35, 0.68, 0.28, 0.62, 0.75, 0.4, 0.5, 0.2, 0.1];
    const grad = ctx.createLinearGradient(0,0,W,0);
    grad.addColorStop(0, '#34d582');
    grad.addColorStop(0.5, '#4dd8c4');
    grad.addColorStop(1, '#4a9dff');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = (i/(pts.length-1)) * (W-10) + 5;
      const y = H - 10 - p*(H-20);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // end dot
    const lastX = W-5, lastY = H - 10 - pts[pts.length-1]*(H-20);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 6, 0, Math.PI*2);
    ctx.fillStyle = '#4a9dff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(lastX, lastY, 9, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(74,157,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ---------- Modal / add transaction ----------
  const modalBg = document.getElementById('modalBg');
  const fCat = document.getElementById('fCat');
  const catField = document.getElementById('catField');
  let currentType = 'expense';

  Object.entries(CATEGORIES).forEach(([key, c]) => {
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = c.name;
    fCat.appendChild(opt);
  });

  function openModal(){
    modalBg.classList.add('show');
    document.getElementById('fAmount').value = '';
    document.getElementById('fName').value = '';
    setType('expense');
    haptic('impact');
  }
  function closeModal(){ modalBg.classList.remove('show'); }
  function setType(type){
    currentType = type;
    const segE = document.getElementById('segExpense');
    const segI = document.getElementById('segIncome');
    segE.classList.toggle('active', type==='expense');
    segE.classList.toggle('expense-active', type==='expense');
    segI.classList.toggle('active', type==='income');
    segI.classList.toggle('income-active', type==='income');
    catField.style.display = type === 'expense' ? 'block' : 'none';
  }

  document.getElementById('addBtn').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('segExpense').addEventListener('click', () => setType('expense'));
  document.getElementById('segIncome').addEventListener('click', () => setType('income'));
  modalBg.addEventListener('click', (e) => { if (e.target === modalBg) closeModal(); });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const amount = parseFloat(document.getElementById('fAmount').value);
    const name = document.getElementById('fName').value.trim();
    if (!amount || amount <= 0) { showToast('Вкажіть суму'); return; }
    if (!name) { showToast('Вкажіть назву'); return; }
    const tx = {
      id: Date.now(),
      type: currentType,
      name,
      cat: currentType === 'expense' ? fCat.value : 'other',
      amount,
      date: new Date().toISOString()
    };
    state.transactions.push(tx);
    saveState();
    render();
    closeModal();
    showToast(currentType === 'expense' ? 'Витрату додано' : 'Дохід додано');
    haptic('success');
  });

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Bottom nav ----------
  document.querySelectorAll('.nav-item[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item[data-nav]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      haptic('impact');
    });
  });

  document.getElementById('eyeBtn').addEventListener('click', () => {
    const el = document.getElementById('balanceAmt');
    el.dataset.hidden = el.dataset.hidden === '1' ? '0' : '1';
    const { balance } = computeTotals();
    el.textContent = el.dataset.hidden === '1' ? '••••••' : fmt(balance);
  });

  render();
</script>
</body>
</html>
